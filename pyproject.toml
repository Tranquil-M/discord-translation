[project]
name = "discord-translation"
version = "0.1.0"
description = "A discord bot designed for discord communities where nobody speaks a single language. This program bridges that barrier with a simple to use translation interface."
readme = "README.md"
authors = [
    { name = "Matthew Hannon", email = "matthannon.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deep-translator>=1.11.4",
    "discord-py>=2.7.1",
    "dotenv>=0.9.9",
    "langdetect>=1.0.9",
]

[project.scripts]
discord-translation = "discord_translation:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
